spring.application.name=ceagap
server.port=${PORT:8080}

# Schema is created/updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Photos are sent as base64 inside JSON
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ---- App settings (override with environment variables) ----
# JWT_SECRET            long random string (required in production)
# DATABASE_URL          postgres://user:pass@host:5432/db  OR  jdbc:postgresql://host:5432/db
# DB_USERNAME/DB_PASSWORD  only needed when DATABASE_URL is a jdbc: URL
# CORS_ORIGINS          comma separated origins, only needed if the frontend is hosted separately
# ADMIN1_USERNAME ... ADMIN4_EMAIL   the four private admin accounts
ceagap.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-please}
ceagap.jwt.expiry-days=7
ceagap.cors.origins=${CORS_ORIGINS:*}
