# Render "Blueprint": one click creates the web service (Docker) and a free PostgreSQL database.
# Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: ceagap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceagap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN1_USERNAME
        value: bharath
      - key: ADMIN1_NAME
        value: T. Bharath Kumar
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_USERNAME
        value: sajeev
      - key: ADMIN2_NAME
        value: B. Sajeev
      - key: ADMIN2_PASSWORD
        sync: false
      - key: ADMIN3_USERNAME
        value: bindhu
      - key: ADMIN3_NAME
        value: V. Bindhu
      - key: ADMIN3_PASSWORD
        sync: false
      - key: ADMIN4_USERNAME
        value: navadeepika
      - key: ADMIN4_NAME
        value: U. Nava Deepika
      - key: ADMIN4_PASSWORD
        sync: false

databases:
  - name: ceagap-db
    plan: free
    databaseName: ceagap
    user: ceagap
